seed: 42

model:
  scale: 3
  input_channels: 3
  base_input_channels: 3
  output_channels: 3
  base_architecture: fidelity_rdn
  base_embed_dim: 64
  base_depth: 36
  base_heads: 6
  window_size: 8
  base_upsample_mode: resize_conv
  base_radiometric_calibration: true
  base_spatial_radiometric_calibration: false
  base_rdn_blocks: 20
  base_rdn_layers: 6
  base_rdn_growth: 32
  base_swin_groups: 6
  base_swin_blocks_per_group: 6
  base_mlp_ratio: 2.0
  latent_channels: 4
  vae_channels: 32
  vae_upsample_mode: resize_conv
  lr_channels: 32
  diffusion_widths: [64, 128, 192, 256]
  diffusion_upsample_mode: resize_conv
  context_dim: 768
  degradation_dim: 4
  mapper_channels: 64
  style_dim: 128
  decoder_channels: [64, 48, 32, 24]
  decoder_upsample_mode: resize_conv
  diffusion_steps: 1000
  use_text_conditioning: false
  use_degradation_conditioning: false
  use_evidence_gate: true
  use_edit_gate: false
  use_uncertainty_abstention: false
  use_base_referenced_trust: true
  trust_mode: per_band
  trust_channels: 32
  trust_blocks: 2
  trust_initial_scale: 0.25
  trust_maximum_scale: 1.0
  abstention_confidence_floor: 0.0
  uncertainty_scale: 0.0025
  use_back_projection: false

data:
  manifest: data/oli2msi_manifest.jsonl
  captions: null
  input_mode: paired
  target_key: hr
  condition_key: null
  paired_lr_crop_size: 32
  train_degradation_sampling: fixed
  degradation_seed: 42
  degradation_severity: mild

training:
  stage: base
  # max_optimizer_steps determines the actual horizon; the trainer extends this
  # one-epoch minimum only as far as required.
  epochs: 1
  max_optimizer_steps: 25000
  max_wall_time_minutes: 0
  batch_size: 4
  gradient_accumulation: 4
  learning_rate: 0.0001
  weight_decay: 0.0
  lr_scheduler_type: cosine_warmup
  warmup_steps: 1000
  lr_scheduler_min_lr: 0.000001
  ema_decay: 0.9999
  use_ema_for_evaluation: true
  init_use_ema: true
  discriminator_learning_rate: 0.00005
  discriminator_channels: 32
  num_workers: 4
  amp: true
  gradient_checkpointing: true
  gradient_clip: 1.0
  auto_resume: true
  enforce_init_checkpoint_lineage: true
  progress_mode: compact
  progress_updates_per_epoch: 2
  validate_every: 1
  validation_limit: null
  validation_fixed_seed: true
  validation_sample_steps: 20
  validation_samples: 2
  validation_back_projection_steps: 0
  keep_best_and_latest: true
  checkpoint_metric: val_psnr
  checkpoint_mode: max
  early_stopping_metric: val_psnr
  early_stopping_mode: max
  early_stopping_patience: 0
  early_stopping_min_epochs: 0
  early_stopping_min_delta: 0.0
  joint_latent_source: sampled
  joint_sample_steps: 8
  trust_samples: 1
  train_back_projection_steps: 0
  trust_smoothing_window: 9
  trust_ridge: 0.000001
  local_excess_mse_margin: 0.0
  evidence_calibration_temperature: 0.02
  evidence_improvement_temperature: 0.0001
  evidence_selectivity_weight: 0.0
  output_dir: runs/oli2msi_fidelity_trust_v2_3x/base_race_rdn
  init_checkpoint: null
  resume: null
  loss_weights:
    charbonnier: 0.05
    mse: 1.0
    multiscale_mse: 0.0
    consistency: 0.0
    ssim: 0.02
    gradient: 0.0
    perceptual: 0.0
    wavelet: 0.0
    radiometric: 0.0
    residual_supervision: 0.0
    base_guard: 0.0
    spatial_base_guard: 0.0
    local_excess_mse: 0.0
    trust_projection: 0.0
    kl: 0.0001
    vae_reconstruction: 1.0
    diffusion: 1.0
    evidence_calibration: 0.0
    evidence_improvement: 0.0
    edit_localization: 0.0
    edit_permission: 0.0
    prompt_alignment: 0.0
    adversarial: 0.0

debug:
  enabled: false
  output_dir: runs/oli2msi_fidelity_trust_v2_3x/debug
  every_n_steps: 1000
  max_exports_per_epoch: 1
  print_tensor_stats: true
  fail_on_nonfinite: true
  panel_size: 320
  histogram_bins: 64
  max_feature_channels: 16
  save_tensors: false
  max_saved_tensors: 32
