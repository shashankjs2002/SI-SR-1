# Medium-capacity RGB target with multispectral Sentinel-2 conditioning.
# Requires patches prepared with:
#   geodiff-prepare ... --multispectral-preset rgb-nir-swir

model:
  scale: 4
  input_channels: 6
  output_channels: 3
  base_embed_dim: 40
  base_depth: 4
  base_heads: 5
  window_size: 8
  latent_channels: 4
  vae_channels: 32
  lr_channels: 32
  diffusion_widths: [64, 128, 192, 256]
  context_dim: 768
  degradation_dim: 4
  mapper_channels: 64
  style_dim: 128
  decoder_channels: [64, 48, 32, 24]
  decoder_upsample_mode: resize_conv
  diffusion_steps: 1000

data:
  target_key: hr
  condition_key: ms_hr

training:
  discriminator_channels: 32
