# RGB target with multispectral Sentinel-2 conditioning.
# Requires patches prepared with:
#   geodiff-prepare ... --multispectral-preset rgb-nir-swir

model:
  scale: 4
  input_channels: 6
  output_channels: 3
  base_embed_dim: 32
  base_depth: 4
  base_heads: 4
  window_size: 8
  latent_channels: 4
  vae_channels: 24
  lr_channels: 24
  diffusion_widths: [48, 96, 144, 192]
  context_dim: 768
  degradation_dim: 4
  mapper_channels: 48
  style_dim: 96
  decoder_channels: [48, 36, 24, 24]
  decoder_upsample_mode: resize_conv
  diffusion_steps: 1000

data:
  target_key: hr
  condition_key: ms_hr

training:
  discriminator_channels: 24
  evidence_selectivity_weight: 0.25
  keep_best_and_latest: true
  checkpoint_metric: val_l1
  checkpoint_mode: min
  early_stopping_patience: 5
  early_stopping_min_epochs: 8
  early_stopping_min_delta: 0.0001
  loss_weights:
    charbonnier: 1.0
    consistency: 1.0
    ssim: 0.2
    gradient: 0.15
    perceptual: 0.1
    wavelet: 0.1
    kl: 0.0001
    vae_reconstruction: 1.0
    diffusion: 1.0
    evidence_calibration: 0.15
    edit_localization: 0.05
    edit_permission: 0.05
    prompt_alignment: 0.05
    adversarial: 0.01
