model:
  scale: 3
  input_channels: 3
  output_channels: 3
  base_embed_dim: 32
  base_depth: 4
  base_heads: 4
  window_size: 8
  base_upsample_mode: resize_conv
  latent_channels: 4
  vae_channels: 24
  lr_channels: 24
  diffusion_widths: [48, 96, 144, 192]
  context_dim: 768
  degradation_dim: 4
  mapper_channels: 48
  style_dim: 96
  decoder_channels: [48, 36, 24, 24]
  decoder_upsample_mode: resize_conv
  diffusion_steps: 1000
  use_text_conditioning: false
  use_degradation_conditioning: true
  use_back_projection: true

data:
  manifest: data/landsat_sentinel_3x_manifest.jsonl
  captions: null
  input_mode: paired
  target_key: hr
  condition_key: null
  train_degradation_sampling: fixed
  degradation_seed: 42
  degradation_severity: mild

training:
  stage: base
  epochs: 20
  batch_size: 1
  gradient_accumulation: 8
  learning_rate: 0.0001
  discriminator_learning_rate: 0.00005
  weight_decay: 0.0001
  num_workers: 4
  amp: true
  gradient_checkpointing: true
  gradient_clip: 1.0
  progress_mode: tqdm
  validate_every: 1
  validation_limit: 64
  keep_best_and_latest: true
  checkpoint_metric: val_l1
  checkpoint_mode: min
  early_stopping_patience: 5
  early_stopping_min_epochs: 8
  early_stopping_min_delta: 0.0001
  train_back_projection_steps: 0
  discriminator_channels: 24
  output_dir: runs/landsat_sentinel_3x_small/base
  init_checkpoint: null
  resume: null
  loss_weights:
    charbonnier: 1.0
    consistency: 0.25
    ssim: 0.2
    gradient: 0.15
    perceptual: 0.1
    wavelet: 0.1
    kl: 0.0001
    vae_reconstruction: 1.0
    diffusion: 1.0
    evidence_calibration: 0.15
    edit_localization: 0.05
    edit_permission: 0.05
    prompt_alignment: 0.0
    adversarial: 0.003
